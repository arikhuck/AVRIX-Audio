<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVRIX Compressor Assistance - Set Password</title>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        studio: {
                            50: '#f8f9f5',
                            100: '#f1f2ec',
                            200: '#e8eae1',
                            300: '#cbd5e1',
                            600: '#64748b',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
          background-color: #f1f2ec;
          background-image: 
            radial-gradient(circle at 50% 0%, rgba(2, 132, 199, 0.04) 0%, transparent 60%),
            radial-gradient(circle at 85% 85%, rgba(2, 132, 199, 0.03) 0%, transparent 50%),
            linear-gradient(to bottom, #f8f9f5, #e8eae1);
          background-attachment: fixed;
          color: #1e293b;
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .glass-panel-light {
          background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(245, 246, 241, 0.9) 100%);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border: 1px solid rgba(0, 0, 0, 0.12);
          border-top: 1px solid rgba(255, 255, 255, 1);
          box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .btn-engine-light {
          background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
          border: 1px solid #0284c7;
          color: #ffffff;
          box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25), inset 0 1px 0 rgba(255,255,255,0.3);
          transition: all 0.2s ease;
        }
        .btn-engine-light:hover {
          background: linear-gradient(180deg, #0369a1 0%, #075985 100%);
          box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white">

    <!-- HEADER -->
    <header class="border-b border-black/10 bg-white/80 backdrop-blur-md sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-600 to-sky-800 flex items-center justify-center shadow-lg text-white font-black group-hover:scale-105 transition-transform">
                    <i class="fa-solid fa-sliders text-xl"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <span class="font-black tracking-wider text-base text-slate-800">AVRIX</span>
                        <span class="text-[10px] px-2.5 py-0.5 rounded-full bg-sky-100 text-sky-800 border border-sky-300 uppercase tracking-wider font-bold">Audio Needs</span>
                    </div>
                    <p class="text-[11px] text-slate-500 font-medium hidden sm:block">WE ASSIST YOUR AUDIO NEED</p>
                </div>
            </a>

            <div class="flex items-center space-x-2 bg-white px-3 py-1.5 rounded-lg border border-slate-300 shadow-sm text-xs">
                <span class="text-[11px] text-slate-700 font-bold uppercase tracking-wider">Account Recovery</span>
            </div>
        </div>
    </header>

    <!-- MAIN FORM -->
    <main class="flex-1 max-w-md w-full mx-auto px-4 py-12 flex items-center justify-center">
        <div class="glass-panel-light w-full rounded-2xl p-6 sm:p-8 space-y-6">
            
            <div class="text-center space-y-1">
                <h1 class="text-2xl font-black tracking-wider text-sky-800">Set Password</h1>
                <p class="text-xs text-slate-500 font-medium">Create a new password to secure your AVRIX account</p>
            </div>

            <!-- SUCCESS ALERT -->
            <div id="success-alert" class="hidden p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-semibold flex items-start space-x-2">
                <i class="fa-solid fa-circle-check text-sm mt-0.5 text-emerald-600"></i>
                <span id="success-message">Password updated successfully! Redirecting...</span>
            </div>

            <!-- ERROR ALERT -->
            <div id="error-alert" class="hidden p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-semibold flex items-start space-x-2">
                <i class="fa-solid fa-circle-exclamation text-sm mt-0.5 text-red-600"></i>
                <span id="error-message">Failed to update password.</span>
            </div>

            <form id="reset-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">New Password</label>
                    <input type="password" id="new-password" required minlength="6" placeholder="At least 6 characters" 
                        class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold text-slate-800 focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition-all shadow-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Confirm Password</label>
                    <input type="password" id="confirm-password" required minlength="6" placeholder="Repeat new password" 
                        class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold text-slate-800 focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition-all shadow-sm">
                </div>

                <button type="submit" id="btn-reset" 
                    class="w-full btn-engine-light py-3 rounded-xl text-xs font-bold tracking-wide transition-all shadow-md mt-2 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-key"></i>
                    <span>Save New Password</span>
                </button>
            </form>

            <div class="text-center pt-3 border-t border-slate-200 space-y-2">
                <p class="text-xs text-slate-600 font-medium">
                    Remember your password? 
                    <a href="login.html" class="text-sky-700 font-bold hover:underline">Back to Login</a>
                </p>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-200 bg-white py-4 text-center text-xs text-slate-500 font-semibold">
        AVRIX Audio &copy; 2026 | Professional Mixing Suite
    </footer>

   <!-- SCRIPT LOGIC -->
    <script>
        // Token guard — runs synchronously before DOM loads to prevent flash of content
        // Only allows access when arriving via a valid password recovery email link
        (function() {
            var hash = window.location.hash || '';
            var query = hash.replace(/^#/, '').replace(/&/g, '&');
            var params = new URLSearchParams(query);
            var type = params.get('type');
            var token = params.get('access_token');
            if (!token || type !== 'recovery') {
                window.location.replace('forgot-password.html');
            }
        })();

        const SUPABASE_URL = 'https://ozuyzelpzsvmurjdjilq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_jjcJHXMYxL7ItF-zwct7WQ_-6DlrXp2';
        const supabaseClient = (window.supabase || window.supabasejs).createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener('DOMContentLoaded', () => {
            const resetForm = document.getElementById('reset-form');
            if (resetForm) {
                resetForm.addEventListener('submit', handlePasswordReset);
            }
        });

        async function handlePasswordReset(e) {
            e.preventDefault();
            
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const btn = document.getElementById('btn-reset');
            const errorBox = document.getElementById('error-alert');
            const errorMsg = document.getElementById('error-message');
            const successBox = document.getElementById('success-alert');

            errorBox.classList.add('hidden');
            successBox.classList.add('hidden');

            if (newPassword !== confirmPassword) {
                errorMsg.innerText = "Passwords do not match. Please verify and try again.";
                errorBox.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i><span>Updating Password...</span>`;

            try {
                const { data, error } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                successBox.classList.remove('hidden');
                
                await supabaseClient.auth.signOut();

                setTimeout(() => {
                    window.location.replace('login.html');
                }, 1500);

            } catch (err) {
                errorMsg.innerText = err.message || "An unexpected error occurred while updating your password.";
                errorBox.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-key"></i><span>Save New Password</span>`;
            }
        }
    </script>

    <!-- Anti-Inspect & Right-Click Protection -->
    <script>
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('keydown', (e) => {
            const isCtrlOrMeta = e.ctrlKey || e.metaKey;
            const isShift = e.shiftKey;
            const key = e.key ? e.key.toLowerCase() : '';
            const code = e.keyCode || e.which;

            if (
                key === 'f12' || code === 123 ||
                (isCtrlOrMeta && isShift && (key === 'i' || key === 'j' || key === 'c' || code === 73 || code === 74 || code === 67)) ||
                (isCtrlOrMeta && (key === 'u' || code === 85)) ||
                (isCtrlOrMeta && (key === 's' || code === 83))
            ) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
