<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVRIX Compressor Assistance - Register</title>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        studio: {
                            50: '#f8f9f5',
                            100: '#f1f2ec',
                            200: '#e8eae1',
                            300: '#cbd5e1',
                            600: '#64748b',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
          background-color: #f1f2ec;
          background-image: 
            radial-gradient(circle at 50% 0%, rgba(2, 132, 199, 0.04) 0%, transparent 60%),
            radial-gradient(circle at 85% 85%, rgba(2, 132, 199, 0.03) 0%, transparent 50%),
            linear-gradient(to bottom, #f8f9f5, #e8eae1);
          background-attachment: fixed;
          color: #1e293b;
          font-family: 'Inter', sans-serif;
        }

        .glass-panel-light {
          background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(245, 246, 241, 0.9) 100%);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border: 1px solid rgba(0, 0, 0, 0.12);
          border-top: 1px solid rgba(255, 255, 255, 1);
          box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .btn-engine-light {
          background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
          border: 1px solid #0284c7;
          color: #ffffff;
          box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25), inset 0 1px 0 rgba(255,255,255,0.3);
          transition: all 0.2s ease;
        }
        .btn-engine-light:hover {
          background: linear-gradient(180deg, #0369a1 0%, #075985 100%);
          box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
        }

        .led-green {
          background-color: #059669;
          box-shadow: 0 0 6px #059669;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white">

    <!-- HEADER -->
    <header class="border-b border-black/10 bg-white/80 backdrop-blur-md sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-600 to-sky-800 flex items-center justify-center shadow-lg text-white font-black group-hover:scale-105 transition-transform">
                    <i class="fa-solid fa-sliders text-xl"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <span class="font-black tracking-wider text-base text-slate-800">AVRIX</span>
                        <span class="text-[10px] font-mono px-2.5 py-0.5 rounded-full bg-sky-100 text-sky-800 border border-sky-300 uppercase tracking-wider font-bold">Audio Needs</span>
                    </div>
                    <p class="text-[11px] text-slate-500 font-medium hidden sm:block">WE ASSIST YOUR AUDIO NEED</p>
                </div>
            </a>

            <div class="flex items-center space-x-2 bg-white px-3 py-1.5 rounded-lg border border-slate-300 shadow-sm font-mono text-xs">
                <span class="w-2.5 h-2.5 rounded-full led-green animate-pulse"></span>
                <span class="text-[11px] text-slate-700 font-bold">Register Portal</span>
            </div>
        </div>
    </header>

    <!-- MAIN FORM -->
    <main class="flex-1 max-w-md w-full mx-auto px-4 py-12 flex items-center justify-center">
        <div class="glass-panel-light w-full rounded-2xl p-6 sm:p-8 space-y-6">
            
            <div class="text-center space-y-1">
                <h1 class="text-2xl font-black tracking-wider text-sky-800">Create Account</h1>
                <p class="text-xs text-slate-500 font-medium">Daftar akun untuk menggunakan AVRIX Audio</p>
            </div>

            <!-- SUCCESS ALERT -->
            <div id="success-alert" class="hidden p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-semibold flex items-start space-x-2">
                <i class="fa-solid fa-circle-check text-sm mt-0.5 text-emerald-600"></i>
                <span id="success-message">Pendaftaran berhasil! Mengalihkan ke login...</span>
            </div>

            <!-- ERROR ALERT -->
            <div id="error-alert" class="hidden p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-semibold flex items-start space-x-2">
                <i class="fa-solid fa-circle-exclamation text-sm mt-0.5 text-red-600"></i>
                <span id="error-message">Gagal membuat akun.</span>
            </div>

            <form id="register-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Email Address</label>
                    <input type="email" id="register-email" required placeholder="nama@email.com" 
                        class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold text-slate-800 focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition-all shadow-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Password</label>
                    <input type="password" id="register-password" required minlength="6" placeholder="Minimal 6 karakter" 
                        class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold text-slate-800 focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition-all shadow-sm">
                </div>

                <button type="submit" id="btn-register" 
                    class="w-full btn-engine-light py-3 rounded-xl text-xs font-bold tracking-wide transition-all shadow-md mt-2 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>Daftar Akun</span>
                </button>
            </form>

            <div class="text-center pt-3 border-t border-slate-200 space-y-2">
                <p class="text-xs text-slate-600 font-medium">
                    Sudah memiliki akun? 
                    <a id="login-link" href="login.html" class="text-sky-700 font-bold hover:underline">Login di sini</a>
                </p>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-200 bg-white py-4 text-center text-xs text-slate-500 font-mono font-semibold">
        AVRIX Audio &copy; 2026 | Professional Mixing Suite
    </footer>

    <!-- SCRIPT LOGIC -->
    <script>
        const SUPABASE_URL = 'https://ozuyzelpzsvmurjdjilq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_jjcJHXMYxL7ItF-zwct7WQ_-6DlrXp2';
        const supabaseClient = (window.supabase || window.supabasejs).createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Ambil query param redirect
        const urlParams = new URLSearchParams(window.location.search);
        const redirectParam = urlParams.get('redirect');

        document.addEventListener('DOMContentLoaded', () => {
            const loginLink = document.getElementById('login-link');
            if (loginLink && redirectParam) {
                loginLink.href = `login.html?redirect=${encodeURIComponent(redirectParam)}`;
            }

            const regForm = document.getElementById('register-form');
            if (regForm) {
                regForm.addEventListener('submit', handleRegister);
            }
        });

        async function handleRegister(e) {
            e.preventDefault();
            const email = document.getElementById('register-email').value.trim();
            const password = document.getElementById('register-password').value;
            const btn = document.getElementById('btn-register');
            const errBox = document.getElementById('error-alert');
            const errMsg = document.getElementById('error-message');
            const succBox = document.getElementById('success-alert');

            errBox.classList.add('hidden');
            succBox.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i><span>Mendaftarkan Akun...</span>`;

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });

                if (error) throw error;

                succBox.classList.remove('hidden');
                setTimeout(() => {
                    const target = redirectParam 
                        ? `login.html?redirect=${encodeURIComponent(redirectParam)}` 
                        : 'login.html';
                    window.location.href = target;
                }, 1500);

            } catch (err) {
                errMsg.innerText = err.message || "Gagal membuat akun.";
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-user-plus"></i><span>Daftar Akun</span>`;
            }
        }
    </script>
</body>
</html>
